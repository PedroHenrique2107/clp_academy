; PlatformIO - CLP Academy / ESP32
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Wi-Fi + BLE juntos não cabem no esquema de partição padrão (igual ao aviso
; no cabeçalho do .ino: "Huge APP (3MB No OTA/1MB SPIFFS)" na Arduino IDE).
board_build.partitions = huge_app.csv

monitor_speed = 115200

lib_deps =
	marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
